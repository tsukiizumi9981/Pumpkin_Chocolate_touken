<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刀劍男士剪影圖鑑</title>
<style>
:root { color-scheme: light; --ink:#292929; --muted:#6d6d6d; --line:#dedede; --paper:#f7f7f5; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
header { padding:28px 20px 20px; background:#fff; border-bottom:1px solid var(--line); }
.wrap { max-width:1440px; margin:0 auto; }
h1 { margin:0 0 8px; font-size:clamp(24px,3vw,34px); letter-spacing:.04em; }
.sub { color:var(--muted); margin:0; line-height:1.6; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
input { flex:1; min-width:220px; border:1px solid #ccc; border-radius:10px; padding:12px 14px; font:inherit; background:white; }
button { border:1px solid #ccc; background:white; border-radius:10px; padding:10px 14px; font:inherit; cursor:pointer; }
button:hover { background:#f0f0ee; }
main { max-width:1440px; margin:0 auto; padding:20px; }
.meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:14px; margin:0 0 14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
.card { border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px; cursor:pointer; text-align:center; transition:transform .12s, box-shadow .12s; }
.card:hover { transform:translateY(-2px); box-shadow:0 5px 18px #00000012; }
.card img { width:100%; height:auto; display:block; }
.card .name { font-weight:650; margin-top:8px; font-size:14px; }
.card .hint { color:var(--muted); font-size:12px; margin-top:3px; }
footer { text-align:center; color:var(--muted); padding:28px 16px 36px; font-size:13px; }
dialog { border:0; border-radius:16px; padding:0; max-width:min(92vw,700px); width:100%; box-shadow:0 20px 80px #0005; }
dialog::backdrop { background:#0009; }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
.modal-body { padding:16px; text-align:center; max-height:78vh; overflow:auto; }
.modal-body img { max-width:100%; max-height:70vh; object-fit:contain; }
@media(max-width:500px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } main { padding:14px; } }
</style>
</head>
<body>
<header><div class="wrap">
<h1>刀劍男士剪影圖鑑</h1>
<p class="sub">將兩張原始圖依相同順序配對：上半身剪影＋下半身剪影。點選任一組可放大查看。</p>
<div class="controls">
<input id="search" type="search" placeholder="搜尋組別，例如：第 12 組" aria-label="搜尋組別">
<button id="reset" type="button">顯示全部</button>
</div>
</div></header>
<main>
<div class="meta"><span id="count">共 101 組</span><span>依原圖排列順序</span></div>
<div class="grid" id="grid"></div>
</main>
<footer>剪影圖片由使用者提供；此頁為本地簡易圖鑑，可離線瀏覽。</footer>
<dialog id="viewer">
<div class="modal-head"><strong id="modalTitle">剪影組</strong><button id="close" type="button">關閉 ✕</button></div>
<div class="modal-body"><img id="modalImage" alt="放大的剪影配對"></div>

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const count = document.getElementById('count');
const viewer = document.getElementById('viewer');
function render() {
  const q = search.value.trim().toLowerCase();
  const filtered = characters.filter(c => c.name.toLowerCase().includes(q) || String(c.id).includes(q));
  grid.innerHTML = '';
  filtered.forEach(c => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.setAttribute('aria-label', '查看' + c.name);
    card.innerHTML = `<img src="${c.image}" loading="lazy" alt="${c.name}剪影配對"><div class="name">${c.name}</div><div class="hint">點選放大</div>`;
    card.addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = c.name;
      document.getElementById('modalImage').src = c.image;
      document.getElementById('modalImage').alt = c.name + '剪影配對';
      viewer.showModal();
    });
    grid.appendChild(card);
  });
  count.textContent = `顯示 ${filtered.length} / ${characters.length} 組`;
}
search.addEventListener('input', render);
document.getElementById('reset').addEventListener('click', () => { search.value=''; render(); });
document.getElementById('close').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', e => { if (e.target === viewer) viewer.close(); });
